<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="60%" stop-color="#050e1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sky Blue Linear Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba86c"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)"/>

  <!-- Glowing Orbit Ring -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="250" cy="250" r="232" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtle Constellation stars in avatar bg -->
  <circle cx="120" cy="140" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="380" cy="110" r="2.5" fill="#bae6fd" opacity="0.8"/>
  <circle cx="400" cy="220" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="90" cy="300" r="2" fill="#7dd3fc" opacity="0.6"/>
  <line x1="120" y1="140" x2="160" y2="170" stroke="#38bdf8" stroke-width="0.7" opacity="0.3"/>

  <!-- Developer Character -->
  <!-- Hoodie Body -->
  <path d="M120 460 C130 380, 180 345, 250 345 C320 345, 370 380, 380 460 Z" fill="url(#hoodieGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Hoodie Zipper / Glow Accents -->
  <path d="M250 345 L250 460" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)" opacity="0.85"/>
  <path d="M200 410 C215 440, 235 455, 250 458 C265 455, 285 440, 300 410" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>

  <!-- Neck -->
  <path d="M225 295 L275 295 L270 348 L230 348 Z" fill="#fba86c"/>
  <!-- Neck shadow -->
  <path d="M228 325 C240 338, 260 338, 272 325 L270 348 L230 348 Z" fill="#e08343" opacity="0.3"/>

  <!-- Head Base -->
  <ellipse cx="250" cy="245" rx="65" ry="78" fill="url(#skinGrad)"/>

  <!-- Hair Modern Style -->
  <path d="M185 220 C180 160, 220 145, 255 145 C300 145, 325 170, 320 220 C310 200, 290 190, 250 190 C215 190, 195 205, 185 220 Z" fill="#0f172a"/>
  <!-- Hair highlights with sky blue glow -->
  <path d="M210 160 C235 152, 275 152, 298 165" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Ears -->
  <circle cx="184" cy="245" r="14" fill="#fba86c"/>
  <circle cx="316" cy="245" r="14" fill="#fba86c"/>

  <!-- Glowing Modern Headset -->
  <path d="M180 240 C170 180, 210 145, 250 145 C290 145, 330 180, 320 240" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Headset band glow line -->
  <path d="M185 235 C175 185, 212 150, 250 150 C288 150, 325 185, 315 235" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.9" filter="url(#neonGlow)"/>
  <!-- Headset Ear Cushions with Sky Glow -->
  <rect x="168" y="225" width="18" height="42" rx="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)"/>
  <rect x="314" y="225" width="18" height="42" rx="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)"/>
  <circle cx="177" cy="246" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="323" cy="246" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- Eyebrows -->
  <path d="M212 215 Q228 208 240 216" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M260 216 Q272 208 288 215" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cool Cyber Glasses / Frame -->
  <rect x="204" y="224" width="38" height="24" rx="7" fill="rgba(8, 20, 48, 0.65)" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
  <rect x="258" y="224" width="38" height="24" rx="7" fill="rgba(8, 20, 48, 0.65)" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
  <!-- Bridge of glasses -->
  <line x1="242" y1="235" x2="258" y2="235" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Glasses reflection -->
  <line x1="210" y1="242" x2="225" y2="228" stroke="#ffffff" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>
  <line x1="264" y1="242" x2="279" y2="228" stroke="#ffffff" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>

  <!-- Eyes behind glasses -->
  <circle cx="223" cy="236" r="4" fill="#0f172a"/>
  <circle cx="277" cy="236" r="4" fill="#0f172a"/>
  <circle cx="224.5" cy="234.5" r="1.5" fill="#ffffff"/>
  <circle cx="278.5" cy="234.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M250 244 L246 260 L254 260" fill="none" stroke="#e08343" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confident Smile -->
  <path d="M236 276 Q250 286 264 276" fill="none" stroke="#9a3412" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Floating Hologram / Code Badges -->
  <g opacity="0.85" filter="url(#neonGlow)">
    <rect x="70" y="210" width="70" height="28" rx="6" fill="#031525" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="105" y="229" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;code/&gt;</text>
  </g>

  <g opacity="0.85" filter="url(#neonGlow)">
    <rect x="360" y="250" width="75" height="28" rx="6" fill="#031525" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="397.5" y="269" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">{'dev'}</text>
  </g>
</svg>
