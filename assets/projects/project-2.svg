<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041426"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="p2glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="380" fill="url(#p2bg)"/>

  <!-- Window Frame -->
  <rect x="40" y="35" width="520" height="310" rx="12" fill="#081426" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="35" rx="12" fill="#0d213b"/>
  <path d="M40 70 H560" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="65" cy="52" r="5" fill="#ef4444"/>
  <circle cx="82" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="52" r="5" fill="#10b981"/>
  <text x="125" y="56" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">CloudMetrics SaaS Dashboard</text>

  <!-- Sidebar -->
  <rect x="55" y="85" width="90" height="245" rx="6" fill="#0c1d33"/>
  <rect x="65" y="100" width="70" height="18" rx="4" fill="#0284c7"/>
  <rect x="65" y="130" width="70" height="12" rx="3" fill="#1e3a5f"/>
  <rect x="65" y="152" width="70" height="12" rx="3" fill="#1e3a5f"/>
  <rect x="65" y="174" width="70" height="12" rx="3" fill="#1e3a5f"/>
  <rect x="65" y="196" width="70" height="12" rx="3" fill="#1e3a5f"/>

  <!-- KPI Cards -->
  <rect x="160" y="85" width="115" height="55" rx="6" fill="#0b223d" stroke="#0ea5e9" stroke-width="1"/>
  <text x="170" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9">Total Revenue</text>
  <text x="170" y="125" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">$48,250</text>
  <text x="235" y="125" fill="#10b981" font-family="sans-serif" font-size="10">+24%</text>

  <rect x="290" y="85" width="115" height="55" rx="6" fill="#0b223d" stroke="#1e3a5f" stroke-width="1"/>
  <text x="300" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9">Active Users</text>
  <text x="300" y="125" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">12,840</text>
  <text x="365" y="125" fill="#38bdf8" font-family="sans-serif" font-size="10">+12%</text>

  <rect x="420" y="85" width="125" height="55" rx="6" fill="#0b223d" stroke="#1e3a5f" stroke-width="1"/>
  <text x="430" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9">Server Load</text>
  <text x="430" y="125" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">28.4%</text>
  <text x="505" y="125" fill="#10b981" font-family="sans-serif" font-size="10">Normal</text>

  <!-- Big Neon Graph Chart -->
  <rect x="160" y="152" width="385" height="178" rx="8" fill="#06182c" stroke="#1e3a5f" stroke-width="1"/>
  <text x="180" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">Network Traffic & Data Throughput</text>
  
  <!-- Grid Lines -->
  <line x1="180" y1="200" x2="525" y2="200" stroke="#162e4c" stroke-width="0.8" stroke-dasharray="4"/>
  <line x1="180" y1="240" x2="525" y2="240" stroke="#162e4c" stroke-width="0.8" stroke-dasharray="4"/>
  <line x1="180" y1="280" x2="525" y2="280" stroke="#162e4c" stroke-width="0.8" stroke-dasharray="4"/>

  <!-- Graph Line 1 (Glow Sky Blue) -->
  <path d="M185 270 Q225 240, 260 255 T335 195 T410 220 T480 185 L525 210" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#p2glow)"/>
  <!-- Fill under curve -->
  <path d="M185 270 Q225 240, 260 255 T335 195 T410 220 T480 185 L525 210 L525 310 L185 310 Z" fill="rgba(56, 189, 248, 0.12)"/>

  <!-- Data points -->
  <circle cx="335" cy="195" r="4.5" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <circle cx="480" cy="185" r="4.5" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
</svg>
