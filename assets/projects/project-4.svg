<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03162e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="p4glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="380" fill="url(#p4bg)"/>

  <!-- Window Frame -->
  <rect x="40" y="35" width="520" height="310" rx="12" fill="#071629" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="40" y="35" width="520" height="35" rx="12" fill="#0a213e"/>
  <path d="M40 70 H560" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="65" cy="52" r="5" fill="#ef4444"/>
  <circle cx="82" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="52" r="5" fill="#10b981"/>
  <text x="125" y="56" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">WeatherSky Real-time Radar & Forecast</text>

  <!-- Left Weather Card: Big Temperature -->
  <rect x="60" y="85" width="220" height="240" rx="10" fill="#0c2340" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="80" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11">Jakarta, Indonesia</text>
  <text x="80" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="9">Thursday, 15 October</text>
  
  <!-- Glowing Sun & Cloud -->
  <circle cx="210" cy="140" r="22" fill="#38bdf8" filter="url(#p4glow)" opacity="0.8"/>
  <path d="M185 160 C185 152 192 145 200 145 C204 138 212 135 220 137 C228 138 234 144 235 150 C242 150 248 156 248 162 C248 168 242 174 235 174 L190 174 C185 174 185 168 185 160 Z" fill="#e0f2fe" opacity="0.9"/>

  <text x="80" y="195" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="bold">29°C</text>
  <text x="80" y="222" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Partly Cloudy • Kelembapan 72%</text>

  <!-- Mini stat indicators -->
  <line x1="80" y1="245" x2="260" y2="245" stroke="#1e3a5f" stroke-width="1"/>
  <text x="80" y="270" fill="#94a3b8" font-family="sans-serif" font-size="9">Angin: 14 km/h</text>
  <text x="175" y="270" fill="#94a3b8" font-family="sans-serif" font-size="9">UV Index: 3.5</text>
  <text x="80" y="295" fill="#94a3b8" font-family="sans-serif" font-size="9">Tekanan: 1012 hPa</text>
  <text x="175" y="295" fill="#94a3b8" font-family="sans-serif" font-size="9">Visibilitas: 10 km</text>

  <!-- Right Forecast Grid -->
  <!-- Hourly forecast -->
  <rect x="295" y="85" width="250" height="110" rx="8" fill="#091c33" stroke="#1e3a5f" stroke-width="1"/>
  <text x="310" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold">Prediksi 24 Jam ke Depan</text>

  <rect x="310" y="120" width="48" height="65" rx="5" fill="#0d294a" stroke="#38bdf8" stroke-width="1"/>
  <text x="334" y="136" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">10:00</text>
  <circle cx="334" cy="150" r="6" fill="#38bdf8"/>
  <text x="334" y="174" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">29°</text>

  <rect x="368" y="120" width="48" height="65" rx="5" fill="#0a213c"/>
  <text x="392" y="136" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">13:00</text>
  <circle cx="392" cy="150" r="6" fill="#f59e0b"/>
  <text x="392" y="174" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">32°</text>

  <rect x="426" y="120" width="48" height="65" rx="5" fill="#0a213c"/>
  <text x="450" y="136" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">16:00</text>
  <circle cx="450" cy="150" r="6" fill="#0ea5e9"/>
  <text x="450" y="174" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">28°</text>

  <rect x="484" y="120" width="48" height="65" rx="5" fill="#0a213c"/>
  <text x="508" y="136" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">19:00</text>
  <circle cx="508" cy="150" r="6" fill="#6366f1"/>
  <text x="508" y="174" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">26°</text>

  <!-- Radar Map Mini -->
  <rect x="295" y="205" width="250" height="120" rx="8" fill="#091c33" stroke="#1e3a5f" stroke-width="1"/>
  <text x="310" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold">Live Doppler Wind Wave</text>
  <!-- Concentric radar circles -->
  <circle cx="420" cy="270" r="38" fill="none" stroke="#162e4c" stroke-width="1"/>
  <circle cx="420" cy="270" r="22" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3"/>
  <circle cx="420" cy="270" r="6" fill="#38bdf8"/>
  <line x1="420" y1="270" x2="455" y2="245" stroke="#38bdf8" stroke-width="2" filter="url(#p4glow)"/>
</svg>
