<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p6bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03152a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="p6glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="380" fill="url(#p6bg)"/>

  <!-- Phone Mockup 1 (Left) -->
  <rect x="130" y="30" width="155" height="315" rx="22" fill="#0b1e38" stroke="#38bdf8" stroke-width="2" filter="url(#p6glow)"/>
  <!-- Notch -->
  <rect x="180" y="38" width="55" height="10" rx="5" fill="#040d1a"/>
  <!-- Phone Content 1 -->
  <text x="145" y="72" fill="#94a3b8" font-family="sans-serif" font-size="8">Good Morning ☕</text>
  <text x="145" y="88" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Kopi Senja Utama</text>

  <!-- Search Bar -->
  <rect x="142" y="100" width="131" height="20" rx="6" fill="#0f2b4c"/>
  <text x="152" y="113" fill="#64748b" font-family="sans-serif" font-size="8">Cari kopi favoritmu...</text>

  <!-- Coffee Card 1 -->
  <rect x="142" y="130" width="131" height="85" rx="8" fill="#0d2442" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="170" cy="165" r="20" fill="#0284c7" opacity="0.3"/>
  <text x="170" y="170" fill="#38bdf8" font-size="18" text-anchor="middle">☕</text>
  <text x="200" y="152" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">Caramel Latte</text>
  <text x="200" y="166" fill="#38bdf8" font-family="sans-serif" font-size="8">Extra Cream</text>
  <text x="200" y="185" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Rp 28k</text>

  <!-- Coffee Card 2 -->
  <rect x="142" y="225" width="131" height="85" rx="8" fill="#0d2442" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="170" cy="260" r="20" fill="#0ea5e9" opacity="0.3"/>
  <text x="170" y="265" fill="#38bdf8" font-size="18" text-anchor="middle">🧊</text>
  <text x="200" y="247" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">Iced Americano</text>
  <text x="200" y="261" fill="#38bdf8" font-family="sans-serif" font-size="8">Arabica Beans</text>
  <text x="200" y="280" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Rp 22k</text>

  <!-- Phone Mockup 2 (Right - Order Detail) -->
  <rect x="315" y="30" width="155" height="315" rx="22" fill="#0b1e38" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="365" y="38" width="55" height="10" rx="5" fill="#040d1a"/>
  
  <text x="330" y="72" fill="#38bdf8" font-family="sans-serif" font-size="8">&lt; Back</text>
  <text x="330" y="90" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Detail Pesanan</text>

  <!-- Big Cup Illustration -->
  <rect x="335" y="110" width="115" height="100" rx="10" fill="#0e284a"/>
  <circle cx="392" cy="155" r="30" fill="#0284c7" filter="url(#p6glow)" opacity="0.4"/>
  <text x="392" y="165" fill="#ffffff" font-size="32" text-anchor="middle">☕</text>

  <!-- Customization selectors -->
  <rect x="335" y="225" width="34" height="20" rx="4" fill="#0284c7"/>
  <text x="352" y="238" fill="#fff" font-family="sans-serif" font-size="8" text-anchor="middle">Hot</text>
  <rect x="375" y="225" width="34" height="20" rx="4" fill="#081b33"/>
  <text x="392" y="238" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Cold</text>
  <rect x="415" y="225" width="35" height="20" rx="4" fill="#081b33"/>
  <text x="432" y="238" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Large</text>

  <!-- Checkout Button -->
  <rect x="335" y="280" width="115" height="30" rx="8" fill="#0284c7" filter="url(#p6glow)"/>
  <text x="392" y="299" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Bayar • Rp 28.000</text>
</svg>
